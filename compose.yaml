services:
  beammp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/BeamMP/beammp-server
    container_name: beammp-server
    restart: unless-stopped
    ports:
      - "30814:30814/tcp"
      - "30814:30814/udp"
    volumes:
      # Mount configuration directory
      - ./config:/config
      # Mount resources directory (mods, plugins, etc.)
      - ./resources:/resources:ro
      # Mount working directory for logs and data
      - ./data:/app/data
    environment:
      - TZ=UTC
      # Optionnel: renseigne ton AuthKey BeamMP ici pour démarrer automatiquement
      # - BEAMMP_AUTHKEY=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    # Optional: limit resources
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 128M

