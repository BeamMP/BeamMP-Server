services:
  beammp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/beammp/beammp-server
    container_name: beammp-server
    restart: unless-stopped
    ports:
      - "30814:30814/tcp"
      - "30814:30814/udp"
    volumes:
      # Mount configuration directory
      - ./config:/config
      # Mount resources directory (mods, plugins, etc.)
      - ./Resources:/app/Resources
    environment:
      - TZ=UTC

